nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  keyVaults:
    pcs:
      secrets:
        - pcs-frontend-s2s-secret
        - pcs-frontend-idam-secret
        - launchdarkly-sdk-key
        - pcs-os-client-lookup-key
        - app-insights-connection-string
  environment:
    REDIS_CONNECTION_STRING: redis://${SERVICE_NAME}-redis-master:6379
    OIDC_REDIRECT_URI: 'https://${SERVICE_FQDN}/oauth2/callback'
    PCS_API_URL: '${PCS_API_URL}'
    CDAM_URL: '${CDAM_URL}'
    CCD_URL: '${DATA_STORE_URL_BASE}'
    CASE_TYPE_ID: '${CASE_TYPE_ID}'
    XUI_BASE_URI: '${XUI_BASE_URI}'
    REDIRECTS_MANAGE_CASE_RETURN_URL: '${REDIRECTS_MANAGE_CASE_RETURN_URL}'
    PAYMENT_RETURN_URL: 'https://${SERVICE_FQDN}/payment/return'
    LAUNCHDARKLY_ENV: '${SERVICE_FQDN}'
redis:
  image:
    registry: hmctsprod.azurecr.io
    repository: imported/bitnami/redis
  enabled: true
  master:
    # HDPI-8155: Dynatrace node instrumentation on preview adds ~1s per
    # spawned process; the chart-default 2s exec-probe budget leaves redis
    # permanently Running-but-not-Ready (frontends then ECONNREFUSED :6379).
    # Measured probe wall time under instrumentation: 3.4-4.1s.
    readinessProbe:
      timeoutSeconds: 6
      periodSeconds: 10
    livenessProbe:
      timeoutSeconds: 8
global:
  security:
    allowInsecureImages: true
