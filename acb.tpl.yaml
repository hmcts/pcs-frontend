# ACR Build Task template for pcs-frontend.
#
# The Jenkins library (cnp-jenkins-library, sectionBuildAndTest.groovy) looks for
# this file; when present it renders it to `acb.yaml` — substituting {{CI_IMAGE_TAG}}
# (e.g. `pcs/frontend:pr-1234`) and {{REGISTRY_NAME}} — and runs that instead of a
# plain `az acr build`. See docs at:
#   https://learn.microsoft.com/azure/container-registry/container-registry-tasks-reference-yaml
#
# Why this exists rather than relying on the default `az acr build`:
#
#  1. ACR Tasks uses the LEGACY (non-BuildKit) docker builder, which builds every
#     stage it encounters up to `--target`, whether or not the target depends on it.
#     The default build has no `--target`, so it built all stages including the
#     (now-deleted) `development` stage and threw the result away. Pinning
#     `--target runtime` means only the stages runtime actually needs are built.
#     NOTE: because the legacy builder walks stages in file order, any stage added
#     to the Dockerfile AFTER `runtime` is skipped, but one added BEFORE it is still
#     built. Keep non-production stages below `runtime`.
#
#  2. `--cache-from` lets a build reuse layers from the previous build's pushed
#     images. The expensive layer is `yarn install` in the `dependencies` stage
#     (~44s of a ~113s cold build); it only changes when package.json / yarn.lock /
#     .yarnrc.yml change, so most builds can reuse it.
#
# pcs-frontend is deployed to AKS on amd64 only, so — unlike the multi-arch CCD
# templates this is modelled on — there is no arm64 half and no manifest juggling.

version: 1.0-preview-1
steps:
  # Pull the shared HMCTS node base image up front so a transient registry blip
  # gets retried here rather than failing the build outright.
  - id: pull-hmcts-base
    cmd: docker pull --platform linux/amd64 hmctsprod.azurecr.io/base/node:20-alpine
    when: ["-"]
    retries: 3
    retryDelay: 5

  # Previous builds' cache images. `|| true` so the very first build (and any build
  # after a registry purge) proceeds with a cold cache instead of failing.
  - id: pull-base-cache
    cmd: docker pull --platform linux/amd64 {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/base:amd64 || true
    when: ["-"]
    retries: 3
    retryDelay: 5

  - id: pull-dependencies-cache
    cmd: docker pull --platform linux/amd64 {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/dependencies:amd64 || true
    when: ["-"]
    retries: 3
    retryDelay: 5

  - id: base
    build: >
      -t {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/base:amd64
      --cache-from {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/base:amd64
      --platform linux/amd64
      --target base
      .
    when:
      - pull-hmcts-base
      - pull-base-cache
    timeout: 7200
    retries: 3
    retryDelay: 5

  # Built as its own tag purely so `yarn install` can be cached across builds.
  - id: dependencies
    build: >
      -t {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/dependencies:amd64
      --cache-from {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/base:amd64
      --cache-from {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/dependencies:amd64
      --platform linux/amd64
      --target dependencies
      .
    when:
      - base
      - pull-dependencies-cache
    timeout: 7200
    retries: 3
    retryDelay: 5

  # The deployable image. Stops at `runtime`, so `development` is never built.
  - id: runtime
    build: >
      -t {{REGISTRY_NAME}}.azurecr.io/{{CI_IMAGE_TAG}}
      --cache-from {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/base:amd64
      --cache-from {{REGISTRY_NAME}}.azurecr.io/pcs/frontend/dependencies:amd64
      --platform linux/amd64
      --target runtime
      .
    when:
      - base
      - dependencies
    timeout: 7200
    retries: 3
    retryDelay: 5

  # Push the cache tags alongside the deployable image so the next build can reuse
  # them. The runtime image tag is what Flux/Helm deploys.
  - id: push-images
    push:
      - "{{REGISTRY_NAME}}.azurecr.io/pcs/frontend/base:amd64"
      - "{{REGISTRY_NAME}}.azurecr.io/pcs/frontend/dependencies:amd64"
      - "{{REGISTRY_NAME}}.azurecr.io/{{CI_IMAGE_TAG}}"
    when:
      - runtime
    retries: 3
    retryDelay: 5
